# Jenkins Configuration as Code for the Docker Compose controller (docker-compose.jenkins.yml).
# Secrets come from environment variables (CASC_GITHUB_TOKEN, JENKINS_ADMIN_PASSWORD, optional
# CASC_RENDER_DEPLOY_HOOK_URL); none are stored in this repository.
jenkins:
  systemMessage: "D2D Audit Services - self-hosted open-source Jenkins CI/CD (zero GitHub Actions minutes)"
  numExecutors: 4
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-cvpeceee"
              description: "GitHub cvpeceee (CASC_GITHUB_TOKEN)"
              username: "${CASC_GITHUB_USER:-cvpeceee}"
              password: "${CASC_GITHUB_TOKEN}"
          - string:
              scope: GLOBAL
              id: "render-deploy-hook-url"
              description: "Render deploy hook URL ('unset' = rely on Render auto-deploy)"
              secret: "${CASC_RENDER_DEPLOY_HOOK_URL:-unset}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8085/}"
  timestamper:
    allPipelines: true

jobs:
  - script: >
      multibranchPipelineJob('D2DAuditServices') {
        displayName('D2D Audit Services')
        description('main, branches and pull requests of the private cvpeceee/D2DAuditServices repo. Scanned (polled) every 2 minutes because no public webhook endpoint exists.')
        branchSources {
          branchSource {
            source {
              github {
                id('d2daudit-github')
                repoOwner('cvpeceee')
                repository('D2DAuditServices')
                repositoryUrl('https://github.com/cvpeceee/D2DAuditServices')
                configuredByUrl(true)
                credentialsId('github-cvpeceee')
                traits {
                  gitHubBranchDiscovery {
                    strategyId(3)
                  }
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
      }
