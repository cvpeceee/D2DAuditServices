services:
  jenkins-postgres:
    image: postgres:16-alpine
    container_name: d2d-jenkins-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: d2d
      POSTGRES_PASSWORD: "${JENKINS_POSTGRES_PASSWORD:-d2d_ci_password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2d -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: d2d-jenkins
    restart: unless-stopped
    depends_on:
      jenkins-postgres:
        condition: service_healthy
    ports:
      - "${JENKINS_PORT:-8085}:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_USER: "${JENKINS_ADMIN_USER:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD before starting Jenkins}"
      JENKINS_URL: "${JENKINS_URL:-http://localhost:8085/}"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TEST_POSTGRES: "Host=jenkins-postgres;Port=5432;Database=postgres;Username=d2d;Password=${JENKINS_POSTGRES_PASSWORD:-d2d_ci_password}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
      # Optional: uncomment only if you prefer Testcontainers over the built-in jenkins-postgres service.
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
