services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: d2d
      POSTGRES_PASSWORD: d2d_dev_password
      POSTGRES_DB: d2d_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2d -d d2d_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: d2d
      MINIO_ROOT_PASSWORD: d2d_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  temporal:
    image: temporalio/temporal:1.27.2
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233"]
    ports:
      - "7233:7233"

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ControlPlane: Host=postgres;Port=5432;Database=d2d_control;Username=d2d;Password=d2d_dev_password
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: d2d
      Storage__SecretKey: d2d_dev_password
      Storage__Bucket: d2d-evidence
      Storage__ForcePathStyle: "true"
      Storage__ObjectLock: "false"
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      temporal:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  pgdata:
  minio:
