services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: d2d
      POSTGRES_PASSWORD: d2d_dev_password
      POSTGRES_DB: d2d_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2d -d d2d_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ControlPlane: Host=postgres;Port=5432;Database=d2d_control;Username=d2d;Password=d2d_dev_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  pgdata:
